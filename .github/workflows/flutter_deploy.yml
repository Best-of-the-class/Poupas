name: Flutter Build Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - windows
          - linux

env:
  FLUTTER_VERSION: "3.41.7"
  JAVA_VERSION: "17"

jobs:
  build-android:
    name: "Build Android"
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'android'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Criar .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Decodificar keystore
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Criar key.properties
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        run: |
          cat <<EOF2 > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF2

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar ícones
        run: dart run flutter_launcher_icons

      - name: Build APK debug
        if: github.ref != 'refs/heads/main' && github.ref_type != 'tag'
        run: flutter build apk --debug --split-per-abi

      - name: Build APK release
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info

      - name: Build AAB release
        if: github.ref_type == 'tag'
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Upload AAB
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30
  build-windows:
    name: "Build Windows"
    runs-on: windows-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'windows'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Criar .env
        shell: bash
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Instalar dependências
        run: flutter pub get

      - name: Habilitar desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Compactar artefato
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath build/pomo-windows-${{ github.sha }}.zip

      - name: Upload artefato Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: build/pomo-windows-${{ github.sha }}.zip
          retention-days: 14
  build-linux:
    name: "Build Linux"
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'linux'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Criar .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Instalar dependências
        run: flutter pub get

      - name: Habilitar desktop Linux
        run: flutter config --enable-linux-desktop

      - name: Build Linux release
        run: flutter build linux --release

      - name: Compactar artefato
        run: |
          tar -czf build/pomo-linux-${{ github.sha }}.tar.gz \
            -C build/linux/x64/release/bundle .

      - name: Upload artefato Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ github.sha }}
          path: build/pomo-linux-${{ github.sha }}.tar.gz
          retention-days: 14
  release:
    name: "Criar GitHub Release"
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-linux]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Pomo ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            dist/**/*.apk
            dist/**/*.aab
            dist/**/*.zip
            dist/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
