name: Flutter Build Pipeline

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - windows
          - linux

env:
  FLUTTER_VERSION: "3.41.7"
  JAVA_VERSION: "17"

jobs:
  build-android:
    name: "Build Android"
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'android'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: echo "${{ secrets.ENV_FILE }}" > .env

      - run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
        if: github.ref == 'refs/heads/main'

      - run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
        if: github.ref == 'refs/heads/main'

      - run: flutter pub get

      - run: dart run flutter_launcher_icons

      - run: flutter build apk --debug --split-per-abi
        if: github.ref != 'refs/heads/main'

      - run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  build-windows:
    name: "Build Windows"
    runs-on: windows-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'windows'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: echo "${{ secrets.ENV_FILE }}" > .env
        shell: bash

      - run: flutter pub get

      - run: flutter config --enable-windows-desktop

      - run: flutter build windows --release

      - run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/pomo-windows-${{ github.sha }}.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: build/pomo-windows-${{ github.sha }}.zip
          retention-days: 14

  build-linux:
    name: "Build Linux"
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'linux'
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: echo "${{ secrets.ENV_FILE }}" > .env

      - run: flutter pub get

      - run: flutter config --enable-linux-desktop

      - run: flutter build linux --release

      - run: |
          tar -czf build/pomo-linux-${{ github.sha }}.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ github.sha }}
          path: build/pomo-linux-${{ github.sha }}.tar.gz
          retention-days: 14

  release:
    name: "Criar GitHub Release"
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-linux]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Pomo v${{ github.run_number }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/**/*.apk
            dist/**/*.aab
            dist/**/*.zip
            dist/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
